name: Build MU Online Android APK

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android build tools
    run: |
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"

  - name: Check project files
    run: |
      test -f android/gradlew
      test -f android/settings.gradle
      test -f android/app/build.gradle
      test -f android/app/src/main/cpp/CMakeLists.txt
      chmod +x android/gradlew

  - name: Check source folders
    run: |
      test -d 5.Main/source
      test -d 5.Main/dependencies
      test -f sokol-master/sokol_time.h

  - name: Build APK
    working-directory: android
    run: |
      ./gradlew --no-daemon :app:assembleRealDeviceDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MU-Online-Android-APK
      path: android/app/build/outputs/apk/**/*.apk
      if-no-files-found: error
